<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT · Startup screen</title>
  <link rel="icon" href="/openai.svg">
  <link rel="stylesheet" href="/dsh-startup/splash.css">
  <link rel="stylesheet" href="/shell.css">
  <link rel="stylesheet" href="/brand.css">
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script defer src="/bridge.js"></script>
</head>
<body>
  <main id="landing">
    <img src="/openai.svg" alt="" width="48" height="48">
    <h1>ChatGPT</h1>
    <p>Your session is ready.</p>
    <div class="landing-actions">
      <button id="launchApp" class="primary" type="button">Open ChatGPT</button>
      <button id="replay" type="button">Replay</button>
      <button id="landingSettings" type="button">Settings</button>
    </div>
    <span id="landingStatus" role="status"></span>
  </main>
  <div id="dsh-startup-root" class="dsu-root dsu-boot"></div>
  <nav id="tools" aria-label="Startup screen controls">
    <button id="settingsButton" type="button" aria-label="Startup settings">Settings</button>
    <button id="closeButton" type="button" aria-label="Close startup screen">×</button>
  </nav>
  <section id="settingsDialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <div class="settings-window">
      <header><div><small>LOCAL PREFERENCES</small><h2 id="settingsTitle">Startup screen</h2></div>
        <button id="closeSettings" type="button" aria-label="Close settings">Done</button>
      </header>
      <div class="settings-content"><div id="settingsPanel"></div></div>
    </div>
  </section>
</body>
</html>
